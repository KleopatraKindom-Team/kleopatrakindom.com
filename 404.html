<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | KleopatraKindom</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: rgba(26, 26, 30, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-color: #a855f7;
            --header-bg: rgba(15, 15, 17, 0.8);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .brand:hover { transform: scale(1.03); }

        .brand img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .brand:hover img { transform: rotate(10deg) scale(1.1); }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
        }

        .custom-select-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .custom-select-btn:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
        }

        .custom-select-btn .arrow {
            font-size: 0.7rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-select-wrapper.open .custom-select-btn .arrow {
            transform: rotate(180deg);
        }

        .custom-select-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1a1a1e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(168, 85, 247, 0.15);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-12px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            min-width: 90px;
            z-index: 200;
        }

        .custom-select-wrapper.open .custom-select-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .option-item {
            padding: 8px 16px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .option-item:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #fff;
        }

        .option-item.selected {
            color: var(--accent-color);
            font-weight: bold;
        }

        main {
            width: 100%;
            max-width: 900px;
            padding: 3.5rem 1.5rem;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3.5rem 2.5rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            text-align: center;
            width: 100%;
        }

        .content-card:hover {
            border-color: rgba(168, 85, 247, 0.25);
            box-shadow: 0 25px 50px rgba(168, 85, 247, 0.1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, #a855f7 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            animation: gradientShift 6s ease infinite alternate;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .error-title {
            font-size: 1.8rem;
            color: #f1f5f9;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .error-desc {
            color: #cbd5e1;
            margin-bottom: 2rem;
            font-size: 1.05rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: #fff;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
            color: #fff;
        }

        footer {
            width: 100%;
            max-width: 900px;
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            header, main, footer { padding-left: 1rem; padding-right: 1rem; }
            .content-card { padding: 2rem 1.5rem; }
            .error-code { font-size: 4.5rem; }
            .error-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="brand">
            <img src="./favicon.png" alt="KleopatraKindom Icon" onerror="this.style.display='none'">
            <span>KleopatraKindom</span>
        </a>
        
        <div class="custom-select-wrapper" id="langDropdown">
            <div class="custom-select-btn" id="langBtn">
                <span id="currentLang">RU</span>
                <span class="arrow">▼</span>
            </div>
            <div class="custom-select-dropdown">
                <div class="option-item" data-value="RU">RU</div>
                <div class="option-item" data-value="EN">EN</div>
                <div class="option-item" data-value="UK">UK</div>
            </div>
        </div>
    </header>

    <main>
        <div class="content-card">
            <div class="error-code">404</div>
            <h1 class="error-title" id="errorTitle">Страница не найдена</h1>
            <p class="error-desc" id="errorDesc">К сожалению, запрашиваемая страница не существует или была перемещена.</p>
            <a href="/" class="btn-home" id="btnHome">На главную</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 KleopatraKindom</p>
    </footer>

    <script>
        const i18n = {
            RU: {
                title: "404 - Страница не найдена | KleopatraKindom",
                heading: "Страница не найдена",
                desc: "К сожалению, запрашиваемая страница не существует или была перемещена.",
                button: "На главную"
            },
            EN: {
                title: "404 - Page Not Found | KleopatraKindom",
                heading: "Page Not Found",
                desc: "Sorry, the page you are looking for does not exist or has been moved.",
                button: "Back to Home"
            },
            UK: {
                title: "404 - Сторінку не знайдено | KleopatraKindom",
                heading: "Сторінку не знайдено",
                desc: "На жаль, запитувана сторінка не існує або була переміщена.",
                button: "На головну"
            }
        };

        function renderPage(lang) {
            const data = i18n[lang] || i18n['RU'];
            document.title = data.title;
            document.getElementById('errorTitle').textContent = data.heading;
            document.getElementById('errorDesc').textContent = data.desc;
            document.getElementById('btnHome').textContent = data.button;
        }

        function changeLanguage(lang) {
            localStorage.setItem('selected_lang', lang);
            document.getElementById('currentLang').textContent = lang;
            
            document.querySelectorAll('.option-item').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.value === lang);
            });

            renderPage(lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const dropdown = document.getElementById('langDropdown');
            const btn = document.getElementById('langBtn');
            const savedLang = localStorage.getItem('selected_lang') || 'RU';

            changeLanguage(savedLang);

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('open');
            });

            document.querySelectorAll('.option-item').forEach(item => {
                item.addEventListener('click', () => {
                    const selectedLang = item.dataset.value;
                    changeLanguage(selectedLang);
                    dropdown.classList.remove('open');
                });
            });

            document.addEventListener('click', () => {
                dropdown.classList.remove('open');
            });
        });
    </script>
</body>
</html>
